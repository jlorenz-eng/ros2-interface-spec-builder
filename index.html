<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Interface Spec Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: tool-like three-column grid — navigation | form | paper preview; narrow: tabs */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --line:#d3dade; --line-strong:#b5c0c7;
  --fg:#16212a; --muted:#5a6976; --accent:#0d6584; --accent-ink:#ffffff; --accent-soft:#d9ebf2;
  --red:#c42a1f; --topic:#2b7a4b; --service:#8d5a0b; --action:#5a4db0;
  --st-open:#b26a00; --st-discuss:#0d6584; --st-done:#2b7a4b;
  --paper:#ffffff; --ink:#151515; --paper-line:#8e959b; --paper-red:#d0021b; --shadow:0 1px 2px rgba(20,35,45,.08),0 6px 24px rgba(20,35,45,.08);
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-paper:Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#151d23; --surface-2:#1b252c; --line:#2a3740; --line-strong:#3a4954;
  --fg:#e2e9ee; --muted:#93a3ae; --accent:#55b6d8; --accent-ink:#05212b; --accent-soft:#163542;
  --red:#ff6f62; --topic:#72cf98; --service:#e2b45d; --action:#aa9df6;
  --st-open:#e7a54a; --st-discuss:#55b6d8; --st-done:#72cf98;
  --paper:#f1f1ee; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#151d23; --surface-2:#1b252c; --line:#2a3740; --line-strong:#3a4954;
  --fg:#e2e9ee; --muted:#93a3ae; --accent:#55b6d8; --accent-ink:#05212b; --accent-soft:#163542;
  --red:#ff6f62; --topic:#72cf98; --service:#e2b45d; --action:#aa9df6;
  --st-open:#e7a54a; --st-discuss:#55b6d8; --st-done:#72cf98;
  --paper:#f1f1ee; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand b{font-family:var(--f-cond);font-weight:600;font-size:17px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);
  padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn svg{width:14px;height:14px}
.tabs{display:none;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}

/* Main grid */
.app{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.05fr)}
.pane{min-height:0;overflow:auto}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 24px;
  padding-left:max(10px,env(safe-area-inset-left,0px))}
.editor{padding:20px 22px 60px}
.preview{background:var(--bg);border-left:1px solid var(--line);padding:22px 22px 60px;
  padding-right:max(22px,env(safe-area-inset-right,0px))}

/* Navigation */
.nav h4{font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 6px 6px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;min-width:0}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="true"]{background:var(--accent-soft)}
.nav-item .t{min-width:0;display:flex;flex-direction:column}
.nav-item .t b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .t small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-row{display:flex;align-items:center;gap:2px;margin-top:10px}
.group-row .nav-item{font-family:var(--f-cond);font-weight:600;font-size:13.5px}
.group-row .nav-item .num{color:var(--muted);font-family:var(--f-mono);font-size:12px;font-weight:400}
.nav-list{display:flex;flex-direction:column;gap:1px;padding-left:8px;border-left:1px solid var(--line);margin-left:12px}
.add-row{display:flex;gap:6px;padding:4px 8px}
.kind{flex:none;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:16px;width:24px;text-align:center}
.kind.topic{color:var(--topic)} .kind.service{color:var(--service)} .kind.action{color:var(--action)}

/* Editor */
.ed-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ed-head h2{font-family:var(--f-cond);font-weight:600;font-size:22px;margin:0;text-wrap:balance;line-height:1.15}
.ed-head .crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin-bottom:14px}
.card > h3{display:flex;align-items:center;gap:10px;font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.card > h3 .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f > span{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],textarea,select{width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.hint code{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* Row tables in the editor */
.block{border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden}
.block-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.block-h b{font-family:var(--f-cond);font-weight:600;font-size:14px;margin-right:auto}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr) minmax(0,1.5fr) auto;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:start}
.row.enum{grid-template-columns:minmax(0,1.2fr) 64px minmax(0,1.5fr) auto}
.row.enum.novals{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto}
.row:last-child{border-bottom:0}
.row.head{background:transparent;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.03em;text-transform:uppercase;padding-block:5px}
.row textarea{min-height:32px;height:32px;resize:none;overflow:hidden}
.row input,.row textarea{padding:5px 7px}
.row-tools{display:flex;gap:0}
.icon{border:0;background:transparent;width:26px;height:30px;display:grid;place-items:center;border-radius:5px;cursor:pointer;color:var(--muted)}
.icon:hover{background:var(--surface-2);color:var(--fg)}
.icon.del:hover{color:var(--red)}
.icon.armed{background:var(--red);color:#fff}
.icon svg{width:14px;height:14px}
.empty{padding:12px;color:var(--muted);font-size:12.5px}
.foot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.enum-title{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.enum-title span{font-family:var(--f-cond);font-weight:600;white-space:nowrap}
.enum-title input{max-width:240px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.opts .check{color:var(--fg);font-size:13px}
.note-row{display:flex;gap:6px;align-items:start;margin-bottom:6px}
.danger-zone{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Paper preview */
.paper{background:var(--paper);color:var(--ink);font-family:var(--f-paper);max-width:640px;margin:0 auto;box-shadow:var(--shadow);
  padding:44px 48px 56px;font-size:12.5px;line-height:1.38;border-radius:2px}
.paper .ttl{font-weight:700;font-size:14px;margin:0}
.paper .ros{font-weight:700;font-size:13.5px;margin:2px 0 12px}
.paper .meta{margin:0 0 12px}
.paper .meta div{margin:0}
.paper table{border-collapse:collapse;width:100%;margin:0 0 14px;table-layout:fixed;color:var(--ink);font-size:inherit;line-height:inherit}
.paper td,.paper th{border:.5px solid var(--paper-line);padding:3px 6px;text-align:left;vertical-align:top;font-weight:400;overflow-wrap:anywhere}
.paper tr.hd th,.paper tr.blk td{font-weight:700}
.paper tr.thick td,.paper tr.thick th{border-bottom:1.5px solid var(--paper-line)}
.paper table.en{font-size:11px}
.paper table.en td.v{width:18px;text-align:center}
.paper .red{color:var(--paper-red);font-weight:700}
.paper .note{font-style:italic;margin:0 0 12px}
.paper .note b{color:var(--paper-red)}
.paper p{margin:0 0 8px}
.paper h1{font-size:22px;margin:0 0 4px;font-weight:700}
.paper h2{font-size:16px;margin:0 0 14px;font-weight:700}
.paper .sub{font-size:14px;margin:0 0 4px}
.paper .small{color:#555;font-size:11.5px;margin:0 0 18px}
.paper .notes{border:.5px solid var(--paper-line);padding:10px 14px;margin:0 0 20px}
.paper .notes b{display:block;margin-bottom:4px}
.paper .notes ul{margin:0;padding-left:18px}
.paper .toc div{display:flex;gap:8px;margin:2px 0}
.paper .toc div.sub{padding-left:16px}
.paper .toc span.d{flex:1;border-bottom:1px dotted #aaa;transform:translateY(-4px)}
.pv-caption{max-width:640px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pv-caption .pill{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:20px;padding:1px 8px}

/* ROS definition box */
pre.code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;overflow-x:auto;white-space:pre;line-height:1.5}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:50;max-width:min(90vw,520px)}

/* Open points (review board) */
.rv-ring{flex:none;display:grid;place-items:center}
.rv-ring circle{fill:none;stroke-width:3.4}
.rv-ring .r-bg{stroke:var(--line)} .rv-ring .r-done{stroke:var(--st-done)} .rv-ring .r-dis{stroke:var(--st-discuss)}
.rv-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.rv-hero .rv-ring circle{stroke-width:7}
.rv-big{display:flex;flex-direction:column;gap:2px;min-width:0}
.rv-big b{font-family:var(--f-cond);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rv-big span{color:var(--muted);font-size:12.5px}
.rv-side{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.meter span{display:block;height:100%}
.meter .m-done{background:var(--st-done)} .meter .m-discuss{background:var(--st-discuss)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--st-open);display:inline-block}
[data-st="discuss"] > .sdot,.sdot.discuss{background:var(--st-discuss)}
[data-st="done"] > .sdot,.sdot.done{background:var(--st-done)}
.callout{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.callout b{font-weight:600}
.teams{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.team-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:2px 10px;cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums}
.team-btn:hover{border-color:var(--accent)}
.team-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.toolbar input{flex:1;min-width:160px;max-width:260px}
.toolbar .sp{flex:1}
.rv-sec{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.rv-sec .c{font-family:var(--f-mono);letter-spacing:0;font-weight:400;text-transform:none}
.rv-part{font-family:var(--f-cond);font-weight:600;font-size:17px;margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line-strong)}
.rv-part:first-child{margin-top:8px;border-top:0;padding-top:0}
.qc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--st-open);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qc[data-st="discuss"]{border-left-color:var(--st-discuss)}
.qc[data-st="done"]{border-left-color:var(--st-done)}
.qc[data-st="done"] .qq,.qc[data-st="done"] .qctx{color:var(--muted)}
.qc[data-st="done"] .qq{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--line-strong)}
.qc.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 5px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.qc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qid{font-family:var(--f-mono);font-weight:500;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:20px;white-space:nowrap}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:0 8px;line-height:18px;color:var(--muted);white-space:nowrap}
.chip.me{border-color:var(--accent);color:var(--accent)}
.chip.block{background:var(--red);border-color:var(--red);color:var(--surface);font-weight:500}
.chip.ghost{border-style:dashed}
.tick{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent}
.tick svg{width:16px;height:16px}
.tick:hover{border-color:var(--st-done);color:var(--st-done)}
.tick[aria-pressed="true"]{background:var(--st-done);border-color:var(--st-done);color:var(--surface)}
.qq{margin:0;font-size:14.5px;font-weight:600;line-height:1.35;text-wrap:pretty}
.qctx{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.qc code,.rel-row code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 3px;color:var(--fg)}
.qc .cmp b{color:var(--red);font-weight:600}
.qlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.link-chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:1px 7px;cursor:pointer;font-size:12px;color:var(--fg)}
.link-chip:hover{border-color:var(--accent);color:var(--accent)}
.link-chip .kind{width:auto;padding:0 3px;line-height:14px}
.qwork{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.qwork .seg button{padding:3px 10px;font-size:12.5px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:13px}
.cmp > div{padding:6px 9px;min-width:0;overflow-wrap:anywhere}
.cmp .ch{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding-block:4px}
.cmp .mine{border-right:1px solid var(--line)}
.rv-empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;margin-top:12px}
.rel-list{display:flex;flex-direction:column;gap:2px}
.rel-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 6px;cursor:pointer;min-width:0}
.rel-row:hover{background:var(--surface-2)}
.rel-row .rel-t{min-width:0;flex:1;font-size:13px}
.rel-row[data-st="done"] .rel-t{color:var(--muted);text-decoration:line-through}
.rel-row .go{color:var(--muted);font-size:12px;white-space:nowrap}
.paper code{font-family:var(--f-mono);font-size:10.5px}
.paper .open{color:#999}
.paper .prop{font-style:italic;color:#444}

/* Safety-Konzept */
.hz{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lv,var(--line-strong));border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hz-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hz-top .hz-name{flex:1;min-width:120px;font-weight:600}
.hz-top .hz-cat{width:130px;flex:none}
.hz-top select{width:auto}
.hz-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
.hz-grid .w2{grid-column:span 2} .hz-grid .w4{grid-column:1/-1}
.lv{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:500;border-radius:20px;padding:1px 9px;border:1px solid var(--lv);color:var(--lv);white-space:nowrap;line-height:18px}
.lv.solid{background:var(--lv);color:var(--surface)}
.caps{display:flex;gap:6px 14px;flex-wrap:wrap}
.esc-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.esc-row input{width:64px}
.esc-row select{width:auto}
.ladder{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ladder .arrow{color:var(--muted)}
.lv-row{display:grid;grid-template-columns:28px minmax(0,.9fr) minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.lv-row:last-child{border-bottom:0}
.lv-num{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.matrix{border-collapse:collapse;font-size:13px;width:100%}
table.matrix th,table.matrix td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
table.matrix tr:last-child td{border-bottom:0}
table.matrix th:first-child,table.matrix td:first-child{text-align:left}
table.matrix th{background:var(--surface-2);font-weight:500;font-size:12px;color:var(--muted)}
table.matrix input{accent-color:var(--accent);width:16px;height:16px}
.auth{display:flex;flex-direction:column;gap:4px}
.auth-row{display:flex;gap:6px;align-items:center}
.auth-row .lv-num{width:22px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sim-list{display:flex;flex-direction:column;gap:3px}
.sim-cat{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:10px 0 2px}
.sim-list .check{color:var(--fg);font-size:13px}
.sim-list .check .lv{margin-left:auto}
.sim-list label.check{display:flex;width:100%}
.result{border:1px solid var(--line);border-left:4px solid var(--lv);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;position:sticky;top:0}
.result .big{font-family:var(--f-cond);font-size:28px;font-weight:600;color:var(--lv);line-height:1.1}
.result .decision{font-weight:600;font-size:14px}
.result ol{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.result ol li.warn{color:var(--fg)}
.result pre.code{white-space:pre-wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* Responsive */
@media (max-width:1180px){
  .tabs{display:inline-flex}
  .app{grid-template-columns:230px minmax(0,1fr)}
  .app[data-view="edit"] .preview{display:none}
  .app[data-view="preview"] .editor{display:none}
  .preview{border-left:0}
}
@media (max-width:760px){
  .hz-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sim{grid-template-columns:minmax(0,1fr)}
  .result{position:static}
  .lv-row{grid-template-columns:24px minmax(0,1fr) auto auto}
  .lv-row > :nth-child(3),.lv-row > :nth-child(4){grid-column:2/-1}
  html,body{height:auto}
  .app{display:block}
  .pane{overflow:visible}
  .nav{border-right:0;border-bottom:1px solid var(--line);max-height:42vh;overflow:auto;padding-right:max(10px,env(safe-area-inset-right,0px))}
  .editor,.preview{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid,.opts{grid-template-columns:minmax(0,1fr)}
  .row,.row.enum,.row.enum.novals{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .row > :nth-child(3){grid-column:1/3}
  .row.enum.novals > :nth-child(2){grid-column:auto}
  .row.head{display:none}
  .paper{padding:26px 20px 36px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<header class="top">
  <div class="brand"><b>Interface Spec Builder</b><span id="docName"></span></div>
  <div class="tabs" role="group" aria-label="View">
    <button id="tabEdit" aria-pressed="true">Edit</button>
    <button id="tabPrev" aria-pressed="false">Preview</button>
  </div>
  <div class="actions">
    <button class="btn ghost" id="btnImport" title="Open a JSON project. Replaces the current project.">Open</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button class="btn" id="btnJson" title="Save the project as JSON to keep editing it later">JSON</button>
    <button class="btn" id="btnMd">Markdown</button>
    <button class="btn primary" id="btnPdf">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8m0 0 3-3m-3 3L5 7M3 12.5h10"/></svg>Create PDF</button>
  </div>
</header>

<main class="app" id="app" data-view="edit">
  <nav class="pane nav" id="nav" aria-label="Structure"></nav>
  <section class="pane editor" id="editor" aria-label="Editor"></section>
  <section class="pane preview" id="preview" aria-label="Preview"></section>
</main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
<script>
(() => {
"use strict";
const STORE_KEY = "ispec-builder-v1";
const KINDS = {
  topic:   { label: "Topic",   sections: ["Message"] },
  service: { label: "Service", sections: ["Request", "Response"] },
  action:  { label: "Action",  sections: ["Goal", "Feedback", "Result"] },
};
const TYPES = ["bool","byte","char","int8","uint8","int16","uint16","int32","uint32","int64","uint64","float32","float64","string",
  "builtin_interfaces/Time","builtin_interfaces/Duration","std_msgs/Header","geometry_msgs/Point","geometry_msgs/Pose","geometry_msgs/PoseStamped",
  "geometry_msgs/Twist","nav_msgs/Path","sensor_msgs/NavSatFix","diagnostic_msgs/KeyValue[]","NamedPath","NamedPath[]","string[]","float32[]"];
const uid = () => Math.random().toString(36).slice(2, 10);
const ICON = {
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4v8m-3.5-3.5L8 12l3.5-3.5"/></svg>',
  del:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
};

/* ---------- Data ---------- */
const F = (name, type, desc) => ({ id: uid(), name, type, desc });
const E = (name, value, desc) => ({ id: uid(), name, value, desc });
const stdResult = () => [F("success","bool",""), F("error_code","uint8","Error Code."), F("message","string","Human-readable error description.")];
function newItem(kind = "action") {
  const fields = {};
  KINDS[kind].sections.forEach(s => fields[s] = []);
  if (kind === "action") fields.Result = stdResult();
  if (kind === "service") fields.Response = stdResult();
  if (kind === "topic") fields.Message = [F("stamp","builtin_interfaces/Time","timestamp")];
  return { id: uid(), name: "New " + KINDS[kind].label, ros: "", kind, direction: "out", sender: "", receiver: "", subsystem: "", short: "",
    description: "", fields, enums: [], notes: [] };
}
function seed() {
  const takeoff = {
    id: uid(), name: "Takeoff", ros: "mission/takeoff", kind: "action", direction: "out", sender: "", receiver: "", subsystem: "FC Adapter",
    short: "Takeoff command.",
    description: "Commands the flight control adapter to arm the propulsion system, perform vertical ascent to the target altitude above ground level and maintain a stable hover.",
    fields: {
      Goal: [F("target_altitude_m","float32","Target altitude above ground level in meters."), F("climb_rate_m_s","float32","Climb velocity in m/s. 0.0 uses FC default.")],
      Feedback: [F("current_altitude_m","float32","Current altitude above ground level in meters."), F("current_climb_rate_m_s","float32","Current climb velocity in m/s."), F("phase","uint8","Current sub-phase of the takeoff maneuver.")],
      Result: [F("success","bool","True if target altitude was reached and stabilized within tolerances."), F("error_code","uint8","Error Code."), F("message","string","Human-readable error description.")],
    },
    enums: [
      { id: uid(), title: "phase", showValues: true, note: "", rows: [E("PHASE_PRE_ARMING","0","Pre-flight checks and validation."), E("PHASE_ARMING","1","Arm."), E("PHASE_CLIMBING","2","Vertical ascent toward target altitude."), E("PHASE_STABILIZING","3","Stabilizing at target altitude.")] },
      { id: uid(), title: "error_code", showValues: true, note: "", rows: [E("ERROR_NONE","0","No error."), E("ERROR_ARMING_FAILED","1","FC rejected arming."), E("ERROR_TIMEOUT","2","Action took longer than max allowed time."), E("ERROR_ABORTED","3","Safety or GC intervention."), E("ERROR_ALTITUDE_UNREACHABLE","4","Altitude is not reachable.")] },
    ],
    notes: ["Phases and error_code require further arrangement with FC Adapter developer."],
  };
  const land = {
    id: uid(), name: "Land", ros: "mission/land", kind: "action", direction: "out", sender: "", receiver: "", subsystem: "FC Adapter",
    short: "Land command.", description: "",
    fields: {
      Goal: [F("descent_rate_m_s","float32","Target descent velocity in m/s. 0.0 uses FC default."), F("disarm_on_ground","bool","Disarm after confirmed touchdown. Default: True.")],
      Feedback: [F("current_altitude_m","float32","Current altitude above ground level in meters."), F("current_descent_rate_m_s","float32","Current descent velocity in m/s."), F("phase","uint8","Current sub-phase of the land maneuver.")],
      Result: [F("success","bool","True if touchdown is confirmed."), F("error_code","uint8","Error Code."), F("message","string","Human-readable error description.")],
    },
    enums: [
      { id: uid(), title: "phase", showValues: true, note: "", rows: [E("PHASE_DESCENDING","0","Controlled descent."), E("PHASE_TOUCHDOWN","1","Ground contact detected."), E("PHASE_DISARMING","2","Disarm.")] },
      { id: uid(), title: "error_code", showValues: true, note: "", rows: [E("ERROR_NONE","0","No error."), E("ERROR_DISARM_FAILED","1","FC rejected disarming."), E("ERROR_TIMEOUT","2","Action took longer than max allowed time."), E("ERROR_ABORTED","3","Safety or GC intervention."), E("ERROR_UNEVEN_TERRAIN","4","Landing unstable due to ground conditions.")] },
    ],
    notes: ["Phases and error_code require further arrangement with FC Adapter developer."],
  };
  const hb = {
    id: uid(), name: "Heartbeat", ros: "navigation/heartbeat", kind: "topic", direction: "in", sender: "Navigation", receiver: "Mission Control", subsystem: "",
    short: "Periodic health signal of the Navigation node.", description: "",
    fields: { Message: [F("stamp","builtin_interfaces/Time","timestamp"), F("heartbeat_count","uint64","A monotonically increasing counter."), F("!!ros_lifecycle_state!!","uint8","ROS 2 node lifecycle status.")] },
    enums: [], notes: [],
  };
  return {
    doc: { title: "Example: Drone Mission Control Interface Specification", subtitle: "", meta: "",
      notes: "the terms “topic”, “service”, “action” refer to the standard communication methods defined in ROS 2\nstatements denoted in !!red!! indicate aspects that require further evaluation\n“mission” as general prefix should be discussed/standardized",
      cover: true, toc: true, numbering: true, pageBreak: true, commType: false },
    groups: [
      { id: uid(), title: "Data FCI receives from MC", overview: true, items: [takeoff, land] },
      { id: uid(), title: "Data MC receives from Navigation", overview: false, items: [hb] },
    ],
    points: examplePoints(), review: {}, safety: exampleSafety(),
  };
}

let state, sel;
function emptyProject() {
  return { doc: { title: "Interface Specification", subtitle: "", meta: "", notes: "", cover: true, toc: true, numbering: true, pageBreak: true, commType: false },
    groups: [{ id: uid(), title: "Data A receives from B", overview: false, items: [] }], review: {}, points: emptyPoints(), safety: minimalSafety() };
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (valid(s)) return s; } } catch (e) {}
  return emptyProject();
}
function valid(s) { return s && s.doc && Array.isArray(s.groups); }
function normalize(s) {
  s.doc = Object.assign({ title:"", subtitle:"", meta:"", notes:"", cover:true, toc:true, numbering:true, pageBreak:true, commType:false }, s.doc);
  s.groups.forEach(g => { g.id ||= uid(); g.items ||= []; g.items.forEach(it => {
    it.id ||= uid(); it.fields ||= {}; it.enums ||= []; it.notes ||= [];
    Object.values(KINDS).forEach(k => k.sections.forEach(sec => { if (it.kind && KINDS[it.kind].sections.includes(sec)) it.fields[sec] ||= []; }));
    Object.values(it.fields).forEach(arr => arr.forEach(f => f.id ||= uid()));
    it.enums.forEach(en => { en.id ||= uid(); en.rows ||= []; en.rows.forEach(r => r.id ||= uid()); if (en.showValues === undefined) en.showValues = true; });
  }); });
  if (s.review === undefined || s.review === null || typeof s.review !== "object") s.review = {};
  s.points = normalizePoints(s.points);
  migrateReviewKeys(s);
  s.safety = normalizeSafety(s.safety);
  return s;
}
let saveT;
function persist() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }, 250); }

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(9)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const splitRed = s => String(s ?? "").split(/(!!.+?!!)/g).filter(Boolean).map(p => /^!!.+!!$/.test(p) ? { t: p.slice(2, -2), red: true } : { t: p, red: false });
const strip = s => String(s ?? "").replace(/!!(.+?)!!/g, "$1");
const rich = s => splitRed(s).map(r => r.red ? `<span class="red">${esc(r.t)}</span>` : esc(r.t)).join("").replace(/\n/g, "<br>");
function grow(el) { el.style.height = "auto"; el.style.height = Math.max(32, el.scrollHeight + 2) + "px"; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

let refreshT;
function changed() { persist(); clearTimeout(refreshT); refreshT = setTimeout(() => { renderNav(); renderPreview(); }, 140); }
function renderAll() { persist(); renderNav(); renderEditor(); renderPreview(); }

function bound(obj, key, { ph = "", multi = false, mono = false, list = null, rows = 2, onEnter = null } = {}) {
  const id = `in-${obj.id || "doc"}-${key}`;
  const el = multi ? h("textarea", { id, rows }) : h("input", { type: "text", id, list });
  el.value = obj[key] ?? ""; el.placeholder = ph; el.spellcheck = !mono;
  if (mono) el.classList.add("mono");
  el.addEventListener("input", () => { obj[key] = el.value; if (multi && el.closest(".row")) grow(el); changed(); });
  if (onEnter) el.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onEnter(); } });
  return el;
}
function labeled(text, el, cls) { return h("label", { class: "f " + (cls || "") }, h("span", null, text), el); }
function checkbox(obj, key, text, after) {
  const id = `cb-${obj.id || "doc"}-${key}`;
  const cb = h("input", { type: "checkbox", id }); cb.checked = !!obj[key];
  cb.addEventListener("change", () => { obj[key] = cb.checked; after ? after() : changed(); });
  return h("label", { class: "check", for: id }, cb, text);
}
function seg(options, value, onPick) {
  return h("div", { class: "seg", role: "group" }, options.map(([v, lbl]) =>
    h("button", { type: "button", "aria-pressed": String(v === value), onclick: () => onPick(v) }, lbl)));
}
function armedBtn(cls, html, title, action, armLabel) {
  const b = h("button", { type: "button", class: cls, title, html });
  b.addEventListener("click", () => {
    if (b.dataset.armed) { action(); return; }
    b.dataset.armed = "1"; b.classList.add("armed");
    if (armLabel) { b.dataset.html = b.innerHTML; b.textContent = armLabel; }
    setTimeout(() => { delete b.dataset.armed; b.classList.remove("armed"); if (armLabel && b.isConnected) b.innerHTML = b.dataset.html; }, 2600);
  });
  return b;
}
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; renderAll(); }
function focusLast(sel2) { requestAnimationFrame(() => { const els = document.querySelectorAll(sel2); const el = els[els.length - 1]; if (el) el.focus(); }); }

function find() {
  if (sel.type === "doc" || sel.type === "review" || sel.type === "safety") return {};
  const gi = state.groups.findIndex(g => g.id === sel.gid); const g = state.groups[gi];
  if (!g) { sel = { type: "doc" }; return {}; }
  if (sel.type === "group") return { g, gi };
  const ii = g.items.findIndex(i => i.id === sel.iid);
  if (ii < 0) { sel = { type: "group", gid: g.id }; return { g, gi }; }
  return { g, gi, it: g.items[ii], ii };
}
const gNum = gi => String.fromCharCode(65 + gi);
const iNum = (gi, ii) => `${gNum(gi)}.${ii + 1}`;

/* ---------- Navigation ---------- */
function renderNav() {
  const nav = $("#nav"); nav.textContent = "";
  $("#docName").textContent = state.doc.title || "";
  const n = state.doc.numbering;
  nav.append(h("h4", null, "Document"),
    h("button", { class: "nav-item", "aria-current": String(sel.type === "doc"), onclick: () => select({ type: "doc" }) },
      h("span", { class: "t" }, h("b", null, state.doc.title || "Untitled"), h("small", null, "Cover & options"))),
    ...reviewNav(),
    ...safetyNav(),
    h("h4", null, "Sections & interfaces"));
  state.groups.forEach((g, gi) => {
    nav.append(h("div", { class: "group-row" },
      h("button", { class: "nav-item", "aria-current": String(sel.type === "group" && sel.gid === g.id), onclick: () => select({ type: "group", gid: g.id }) },
        n ? h("span", { class: "num" }, gNum(gi)) : null, h("span", { class: "t" }, h("b", null, g.title || "Untitled")))));
    const list = h("div", { class: "nav-list" });
    g.items.forEach((it, ii) => list.append(
      h("button", { class: "nav-item", "aria-current": String(sel.type === "item" && sel.iid === it.id), onclick: () => select({ type: "item", gid: g.id, iid: it.id }) },
        h("span", { class: "kind " + it.kind }, it.kind[0].toUpperCase()),
        h("span", { class: "t" }, h("b", null, (n ? iNum(gi, ii) + "  " : "") + strip(it.name || "Unnamed")), h("small", null, strip(it.ros) || "—")))));
    list.append(h("div", { class: "add-row" },
      h("button", { class: "btn ghost small", onclick: () => addItem(g, "action") }, "+ Interface")));
    nav.append(list);
  });
  nav.append(h("div", { class: "add-row", style: "margin-top:12px" },
    h("button", { class: "btn small", onclick: addGroup }, "+ Section")));
}
function select(s) { sel = s; if (window.matchMedia("(max-width:760px)").matches) setView("edit"); renderAll(); $("#editor").scrollTop = 0; }
function addGroup() { const g = { id: uid(), title: "Data X receives from Y", overview: false, items: [] }; state.groups.push(g); select({ type: "group", gid: g.id }); }
function addItem(g, kind) { const it = newItem(kind); g.items.push(it); select({ type: "item", gid: g.id, iid: it.id }); requestAnimationFrame(() => { const el = $(`#in-${it.id}-name`); if (el) { el.focus(); el.select(); } }); }

/* ---------- Editor ---------- */
function renderEditor() {
  const ed = $("#editor"); ed.textContent = "";
  const f = find();
  const focusId = sel.type === "review" ? sel.focus : null;
  if (focusId) { rvFilter = "all"; rvSearch = ""; rvTeam = ""; delete sel.focus; }
  let parts;
  if (sel.type === "doc") parts = docEditor();
  else if (sel.type === "review") parts = reviewBoard();
  else if (sel.type === "safety") parts = safetyEditor();
  else if (sel.type === "group") parts = groupEditor(f.g, f.gi);
  else parts = itemEditor(f.g, f.gi, f.it, f.ii);
  ed.append(...parts.filter(Boolean));
  requestAnimationFrame(() => {
    ed.querySelectorAll(".row textarea").forEach(grow);
    if (focusId) { const el = document.getElementById("qc-" + focusId); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); } }
  });
}

function docEditor() {
  const d = state.doc;
  return [
    h("div", { class: "ed-head" }, h("div", null, h("div", { class: "crumb" }, "Document"), h("h2", null, "Cover & options"))),
    projectIsEmpty() ? h("div", { class: "card", style: "border-color:var(--accent)" }, h("h3", null, "Get started"),
      h("ol", { class: "rules" },
        h("li", null, "Give the document a title below."),
        h("li", null, "Rename the section on the left and add interfaces with “+ Interface”."),
        h("li", null, "Track open questions under “Open points”, e.g. by importing a review as Markdown."),
        h("li", null, "Describe hazards and reactions under “Safety concept” and test them in the simulator."),
        h("li", null, "Export with “Create PDF” or “Markdown”. Save your work with “JSON”.")),
      h("div", { class: "danger-zone", style: "margin-top:10px" },
        h("button", { class: "btn", onclick: () => { state = normalize(seed()); sel = { type: "doc" }; renderAll(); toast("Example loaded"); } }, "Look at an example project first"))) : null,
    h("div", { class: "card" }, h("h3", null, "Cover page"),

/* ---------- ROS definition ---------- */
function rosDef(it) {
  const secs = KINDS[it.kind].sections; const ext = { topic: "msg", service: "srv", action: "action" }[it.kind];
  const placed = new Set();
  const blocks = secs.map(s => {
    const lines = [];
    const fields = it.fields[s] || [];
    it.enums.forEach(en => {
      if (placed.has(en.id) || !en.showValues) return;
      const fld = fields.find(f => strip(f.name).trim().toLowerCase() === strip(en.title).trim().toLowerCase());
      const fallback = !it.enums.some(x => x === en) ? false : s === secs[secs.length - 1] && !secs.some(ss => (it.fields[ss] || []).some(f => strip(f.name).trim().toLowerCase() === strip(en.title).trim().toLowerCase()));
      if (!fld && !fallback) return;
      placed.add(en.id);
      const t = fld ? strip(fld.type).trim() || "uint8" : "uint8";
      lines.push(`# ${strip(en.title)}`);
      en.rows.forEach(r => lines.push(`${t} ${strip(r.name).trim()}=${strip(r.value).trim()}${r.desc ? "  # " + strip(r.desc).replace(/\n/g, " ") : ""}`));
      lines.push("");
    });
    fields.forEach(f => lines.push(`${strip(f.type).trim() || "?"} ${strip(f.name).trim() || "?"}${f.desc ? "  # " + strip(f.desc).replace(/\n/g, " ") : ""}`));
    return (it.kind === "topic" ? "" : `# ${s}\n`) + lines.join("\n");
  });
  return { ext, text: blocks.join("\n---\n") || "# (leer)" };
}

function toMarkdown() {

      if (it.sender || it.receiver) md.push(`${[it.sender && "Sender: " + strip(it.sender), it.receiver && "Receiver: " + strip(it.receiver)].filter(Boolean).join(" \\| ")}  `);

      md.push("", "| Parameter Name | Datatype | Description |", "|---|---|---|");
      KINDS[it.kind].sections.forEach(s => {
        if (it.kind !== "topic") md.push(`| **${s}** | | |`);
        (it.fields[s] || []).forEach(f => md.push(`| ${mr(f.name)} | ${mr(f.type)} | ${mr(f.desc)} |`));
      });
      md.push("");
      it.enums.forEach(en => {
        if (en.showValues) { md.push(`| Classification of ${mr(en.title)} | | |`, "|---|---|---|"); en.rows.forEach(r => md.push(`| ${mr(r.name)} | ${mr(r.value)} | ${mr(r.desc)} |`)); }
        else { md.push(`| Classification of ${mr(en.title)} | |`, "|---|---|"); en.rows.forEach(r => md.push(`| ${mr(r.name)} | ${mr(r.desc)} |`)); }

      String(it.description || "").split(/\n\s*\n/).filter(p => p.trim()).forEach(p => md.push(mr(p), ""));
    });
  });
  return md.join("\n");
}

  const missing = i => (L[i].needs || []).filter(c => lost.has(c));
  let chosen = -1;
  for (let i = floor; i < L.length; i++) {
    const m = missing(i);
    if (!m.length) { chosen = i; break; }
    steps.push({ t: `${nameOf(i)} is not possible (missing: ${m.map(capName).join(", ")}).`, warn: true });
  }
  if (chosen < 0) {
    const fallback = S.authority.filter(a => !a.self && S.authority.indexOf(a) < S.authority.indexOf(selfAuth() || S.authority[S.authority.length - 1]));
    steps.push({ t: `No level is possible.${fallback.length ? ` ${fallback[fallback.length - 1].name} has to take over.` : ""}`, warn: true });
    return { none: true, chosen: -1, steps, decision: "No reaction possible", runIdx, fallback: fallback.length ? fallback[fallback.length - 1].name : "" };
  }
  let decision;
  if (chosen === runIdx) decision = chosen === 0 ? "Monitor only" : `${nameOf(chosen)} keeps running`;
  else if (chosen > runIdx) decision = runIdx > 0 ? `Cancel ${nameOf(runIdx)}, start ${nameOf(chosen)}` : `Start ${nameOf(chosen)}`;
  else decision = chosen > 0 ? `End ${nameOf(runIdx)}, start ${nameOf(chosen)}` : `End ${nameOf(runIdx)}, control returns`;
  return { chosen, steps, decision, runIdx };
}

/* --- Output: preview, Markdown, PDF --- */
function safetyHTML() {
  const S = SP(); const cats = [...new Set(S.hazards.map(catOf))];
  const st = Object.fromEntries(HZ_STATUS);
  let html = `<h2 style="margin-bottom:2px">${esc(S.title || "Safety concept")}</h2><p class="small">Status ${esc(today())} · ${S.hazards.length} hazards · ${S.hazards.filter(x => x.status === "agreed").length} agreed</p>`;
  html += `<p class="ttl" style="margin:0 0 4px">1 Precedence</p><p>${S.authority.map(a => esc(a.name) + (a.self ? " (this module)" : "")).join(" &gt; ")}</p>`;
  html += `<p class="ttl" style="margin:12px 0 4px">2 Rules</p><ol style="margin:0 0 12px;padding-left:18px">${S.rules.filter(r => r.trim()).map(r => `<li>${esc(r)}</li>`).join("")}</ol>`;
  html += `<p class="ttl" style="margin:12px 0 6px">3 Escalation ladder</p><table><tbody><tr class="hd thick"><th style="width:22%">Level</th><th style="width:24%">Action</th><th>Prerequisites</th><th style="width:13%">May end</th></tr>`;
  S.levels.forEach(l => html += `<tr><td>${esc(l.name)}</td><td>${esc(l.action) || "–"}</td><td>${l.needs.map(c => esc(capName(c))).join(", ") || "–"}</td><td>${l.clearable ? "yes" : "no"}</td></tr>`);
  html += "</tbody></table>";
  html += `<p class="ttl" style="margin:12px 0 6px">4 Hazard catalogue</p>`;
  if (!S.hazards.length) html += '<p style="color:#666">No hazards yet.</p>';
  cats.forEach(cat => {
    html += `<p style="font-weight:700;margin:8px 0 4px">${esc(cat)}</p><table class="en"><tbody><tr class="hd thick"><th style="width:22%">Hazard</th><th>Detection</th><th style="width:13%">Level</th><th style="width:20%">Escalation</th><th style="width:13%">Status</th></tr>`;
    S.hazards.filter(x => catOf(x) === cat).forEach(x => {
      const esc2 = x.escTo ? `after ${esc(x.escAfter || "?")} s → ${esc(S.levels[lvIdx(x.escTo)].name)}` : "–";
      const kills = x.kills.length ? `<br><i>makes impossible: ${x.kills.map(c => esc(capName(c))).join(", ")}</i>` : "";
      const why = x.why ? `<br><span style="color:#666">${esc(x.why)}</span>` : "";
      html += `<tr><td>${esc(x.name)}${why}</td><td>${esc(x.detect)}${x.source ? `<br><code>${esc(x.source)}</code>` : ""}<br><span style="color:#666">onset ${esc(x.on || "0")} s · clear ${esc(x.off || "0")} s</span>${kills}</td><td>${esc(S.levels[lvIdx(x.level)].name)}</td><td>${esc2}</td><td>${x.status === "open" ? '<span class="red">Open</span>' : esc(st[x.status] || x.status)}</td></tr>`;
    });
    html += "</tbody></table>";
  });
  return html;
}
function safetyMarkdown() {

  const md = [`# ${S.title || "Safety concept"}`, "", `Status ${today()}`, "", "## 1 Precedence", "", S.authority.map(a => a.name + (a.self ? " (this module)" : "")).join(" > "), "", "## 2 Rules", ""];
  S.rules.filter(r => r.trim()).forEach((r, i) => md.push(`${i + 1}. ${r}`));

  S.levels.forEach(l => md.push(`| ${p(l.name)} | ${l.action ? "`" + l.action + "`" : "–"} | ${p(l.needs.map(capName).join(", ")) || "–"} | ${l.clearable ? "yes" : "no"} |`));
  md.push("", "### Capabilities", "", "| Capability | Meaning |", "|---|---|");
  S.caps.forEach(c => md.push(`| ${p(c.name)} | ${p(c.desc)} |`));
  md.push("", "## 4 Hazard catalogue", "");

    md.push("");
  });
  return md.join("\n");
}

    content.push({ text: cat, bold: true, margin: [0, 4, 0, 4] },
